<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Seasonal Forecasts | ClimateInform</title>

    <link rel="stylesheet" href="/css/style.css">
    <script src="/scripts/ui.js" defer></script>

    <style>
        /* Existing controls */
        .control-row {
            margin: 20px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
        }
        select {
            padding: 6px;
            font-size: 15px;
        }
        #map-display {
            width: 100%;
            max-width: 900px;
            border: 1px solid #ccc;
            margin-top: 20px;
        }

        /* NINO section */
        #nino34-display { margin-left: -10px; }
        .nino-wrapper { max-width: 900px; margin: 0; }
        .nino-row { display: flex; justify-content: flex-start; gap: 6px; }
        .nino-panel { max-width: 280px; width: 100%; height: auto; }
    </style>
</head>

<body>

<header>
    ClimateInform Seasonal Forecasts <span>Interactive Viewer</span>
</header>

<div id="scroll-progress"></div>

<div id="left-nav">
    <table>
        <tr><td><a href="/index.html">🏠 Home</a></td></tr>
        <tr><td><a href="/about_us.html">About Us</a></td></tr>
        <tr><td><a href="/disclaimer.html">Disclaimer</a></td></tr>

        <tr><td><a href="/pages/forecasts/seasonal.html">Seasonal Forecast</a></td></tr>
        <tr><td><a href="/pages/forecasts/monthly.html">Monthly Forecast</a></td></tr>

        <tr><td><a href="/contact.html">Contact</a></td></tr>
    </table>
</div>

<div id="main-content">

    <h2 style="color:#003366;">Seasonal Forecasts</h2>

    <!-- Row 1: Issue Year + Issue Month -->
    <div class="control-row">
        <label>Issue Year:</label>
        <select id="year-select"></select>

        <label>Issue Month:</label>
        <select id="month-select"></select>
    </div>

    <!-- Row 2: Variable + Map Type + Lead -->
    <h3>Maps of Forecast & Skill</h3>
    <p><span style="color:#66ccff;">Select options below to view maps</span></p>

    <div class="control-row">
        <label>Variable:</label>
        <select id="variable-select">
            <option value="sst">SST</option>
            <option value="t2m">Temperature</option>
            <option value="prec">Precipitation</option>
        </select>

        <label>Map Type:</label>
        <select id="maptype-select">
            <option value="det">Anomaly</option>
            <option value="prob">Probability</option>
            <option value="ACC">Skill(ACC)</option>
            <option value="HSS">Skill(HSS)</option>
            <option value="RPSS">Skill(RPSS)</option>
        </select>

        <label>Lead:</label>
        <select id="lead-select">
            <option value="0">Lead 0</option>
            <option value="1">Lead 1</option>
            <option value="2">Lead 2</option>
            <option value="3">Lead 3</option>
            <option value="4">Lead 4</option>
            <option value="5">Lead 5</option>
            <option value="6">Lead 6</option>
            <option value="7">Lead 7</option>
        </select>
    </div>

    <!-- Map display -->
    <img id="map-display" src="/assets/placeholder.png" alt="Seasonal Forecast Map">

</div> <!-- END main-content -->

<!-- NINO3.4 Display Section -->
<section id="nino34-display" style="margin-top:20px;">
  <h3 style="text-align:left;">NINO3.4 Index Forecast</h3>

  <div class="nino-wrapper">
    <div class="nino-row">
      <img id="nino34-fcst" class="nino-panel" alt="NINO3.4 Forecast">
      <img id="nino34-skill" class="nino-panel" alt="NINO3.4 Skill">
    </div>
  </div>
</section>

<footer>
    © 2026 ClimateInform Corp |
    <a href="/disclaimer.html">Disclaimer</a> |
    <a href="/contact.html">Contact</a> |
    <a href="/about_us.html">About Us</a>
</footer>

<button id="back-to-top" title="Back to Top">↑</button>

<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<script src="/scripts/ui.js" defer></script>

</body>
</html>
